<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<!-- ========================= -->

    <img
        src="images/dragonfly1.png"
        id="dragonfly"
        alt="잠자리">

        <img src="images/leaf2.png" id="swingLeaf">

</div>


<!-- ========================= -->
<!-- PAGE 2 -->
<!-- ========================= -->

<div id="page2" class="page">

    <img src="images/page2.png" class="background">

    <!-- 나뭇잎이 생성되는 영역 -->
    <div id="leafArea"></div>

</div>
